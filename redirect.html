<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pausa — Recordá tus metas</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Elegant font pairing: Fraunces (serif display) + Inter (clean sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Fraunces', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in-up': 'fade-in-up 1.4s cubic-bezier(0.22, 1, 0.36, 1) both',
            },
          },
        },
      };
    </script>

    <style>
      /* Subtle, calming staggered fade-in on load */
      .fade-1 { animation: fadeInUp 1.2s ease-out 0.15s both; }
      .fade-2 { animation: fadeInUp 1.2s ease-out 0.55s both; }
      .fade-3 { animation: fadeInUp 1.2s ease-out 0.95s both; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Respect users who prefer reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .fade-1, .fade-2, .fade-3 { animation: none; opacity: 1; }
      }
    </style>
  </head>

  <body class="h-screen overflow-hidden bg-zinc-900 text-zinc-300 antialiased selection:bg-zinc-700 selection:text-zinc-100">
    <main class="flex h-full flex-col items-center justify-center px-6 text-center">
      <!-- Soft ambient glow for depth without glare -->
      <div
        aria-hidden="true"
        class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_center,rgba(63,63,70,0.35),transparent_65%)]"
      ></div>

      <div class="relative max-w-3xl">
        <!-- Quiet label -->
        <p class="fade-1 mb-8 font-sans text-xs font-medium uppercase tracking-[0.35em] text-zinc-500">
          Pausa · Respirá
        </p>

        <!-- Core goals: larger, slightly bolder -->
        <h1 class="fade-2 font-serif text-4xl font-semibold leading-snug tracking-tight text-zinc-200 sm:text-5xl md:text-6xl">
          Acordate del ISEN,
          <br class="hidden sm:block" />
          Posgrado en Europa,
          <br />
          y todo lo que queres después del titulo.
        </h1>

        <!-- Gentle divider -->
        <div class="fade-3 mx-auto mt-10 h-px w-16 bg-zinc-700"></div>

        <!-- Concluding advice: softer, smaller -->
        <p class="fade-3 mt-8 font-sans text-lg font-light italic leading-relaxed text-zinc-400 sm:text-xl">
          Si hace falta, descansa, paciencia.
        </p>
      </div>
    </main>
  </body>
</html>
