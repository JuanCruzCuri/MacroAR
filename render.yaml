# Blueprint de Render: crea el backend y su base PostgreSQL.
# Render → New → Blueprint → elegir este repo. No hace falta cargar secretos a mano:
# DATABASE_URL se toma de la base creada y SCRAPE_TOKEN se genera automáticamente.
services:
  - type: web
    name: macroar-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # requirements.txt fija versiones sin wheels para Python 3.13 (psycopg2-binary, asyncpg)
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: macroar-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://juancruzcuri.github.io
      - key: SCRAPE_DAY_OF_WEEK
        value: "*"
      - key: SCRAPE_HOUR
        value: 18
      - key: SCRAPE_MINUTE
        value: 0
      - key: SCRAPE_TIMEZONE
        value: America/Argentina/Buenos_Aires
      # Token para POST /api/scrape (copiarlo al secret SCRAPE_TOKEN de GitHub Actions)
      - key: SCRAPE_TOKEN
        generateValue: true
    plan: free
    healthCheckPath: /api/health

databases:
  - name: macroar-db
    plan: free
    databaseName: macroar
    user: macroar
