# Blueprint de Render: crea el backend.
# Render → New → Blueprint → elegir este repo.
# - DATABASE_URL: connection string de Neon (https://neon.tech, plan free sin vencimiento).
#   Se carga a mano en Render → macroar-backend → Environment.
# - SCRAPE_TOKEN se genera automáticamente.
services:
  - type: web
    name: macroar-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # requirements.txt fija versiones sin wheels para Python 3.13 (psycopg2-binary, asyncpg)
      - key: PYTHON_VERSION
        value: 3.11.11
      # PostgreSQL en Neon. Las bases free de Render vencen a los 30 días.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://juancruzcuri.github.io
      - key: SCRAPE_DAY_OF_WEEK
        value: "*"
      - key: SCRAPE_HOUR
        value: 18
      - key: SCRAPE_MINUTE
        value: 0
      - key: SCRAPE_TIMEZONE
        value: America/Argentina/Buenos_Aires
      # Token para POST /api/scrape (copiarlo al secret SCRAPE_TOKEN de GitHub Actions)
      - key: SCRAPE_TOKEN
        generateValue: true
    plan: free
    healthCheckPath: /api/health
